<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .conteiner{
            background-color: darkgray;
            display: flex;
            flex-flow: row nowrap;
            
        }
        .itens{
            background-color: gold;
            border: 1px solid black;
            flex-basis: 200px;   
            text-align: center;     
        }
        #um{
            flex-shrink: 0;
            flex-grow:0;
        }
        #dois{
            flex-shrink: 1;
            flex-grow: 0;
        }
        #tres{
            flex-shrink: 4;
            flex-grow: 0;
        }

        
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens" id="um">A</div>
        <div class="itens" id="dois">B</div>
        <div class="itens" id="tres">C</div>
        
    </div>
</body>
</html>
