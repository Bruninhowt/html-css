<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .conteiner{
            background-color: darkgray;
            display: flex;
            flex-flow: row wrap;
        }

        .itens{
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens" id="i1">A</div>
        <div class="itens" id="i2">B</div>
        <div class="itens" id="i3">C</div>
        <div class="itens" id="i4">Dddddddddddddd</div>
        <div class="itens" id="i5">E</div>
        <div class="itens" id="i6">G</div>
        <div class="itens" id="i7">H</div>
    </div>
</body>
</html>
