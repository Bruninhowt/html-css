<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .conteiner{
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-flow: column wrap-reverse;
            width: 700px;
        }

        .itens{
            border: 1px solid black;
            text-align: center;
            background-color: red;
            color: white;
            
            flex: auto;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens">Exenplo de bloco A</div>
        <div class="itens">Exenplo de bloco B</div>
        <div class="itens">Exenplo de bloco C</div>
        <div class="itens">Exenplo de bloco D</div>
        <div class="itens">Exenplo de bloco E</div>
    </div>
</body>
</html>
