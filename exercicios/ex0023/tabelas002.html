<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 2</title>
    <style>
        table{
            width: 400px;
        }
        td, th{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <head>
            <th>Cidade</th>
            <th>População</th>
        </head>
            
        <tbody>
            <tr>
                <td>Sao Paulo</td>
                <td>10000</td>
            </tr>
            <tr>
                <td>Cachoeira do Sul</td>
                <td>1000</td>
            </tr>
        </tbody>

        <tfoot>
            <td>Totla de População</td>
            <td>178000</td>
        </tfoot>
        
        
    </table>

</body>
</html>
