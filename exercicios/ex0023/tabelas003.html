<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem</title>
    <h1>Mesclagem de celulas</h1>
    <style>
        tr, td{
            border: 1px solid black;
            width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td rowspan="2">A</td>
            <td colspan="2">B</td>
            
        </tr>
        <tr>
            
            <td rowspan="2">E</td>
            <td rowspan="5">F</td>
        </tr>
        <tr>
            <td>G</td>
            
            
        </tr>
        <tr>
            <td>K</td>
            <td>L</td>
            
        </tr>
        <tr>
            <td>N</td>
            <td>O</td>
            
        </tr>
        <tr>
            <td>Q</td>
            <td>R</td>
            
        </tr>
    </table>
</body>
</html>
