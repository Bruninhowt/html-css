<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .conteiner{
            display: grid;
            border: 1px solid black;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .itens{
            border: 1px solid red;

        }
        #caixa1{
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;
        }
        #caixa2{
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
        }
        #caixa3{
            grid-row-start: 2;
            grid-row-end: 5;
            grid-column-start: 3;
            grid-column-end: 5;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="itens" id="caixa1">Caixa 1</div>
        <div class="itens" id="caixa2">Caixa 2</div>
        <div class="itens" id="caixa3">Caixa 3</div>
    </div>
</body>
</html>
