<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 02</title>
    <style>
        td{
            border: 1px solid black;
            padding: 20px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>F</td>
            <td>G</td>
            <td>H</td>
        </tr>
        <tr>
            
            <td>J</td>
            <td>K</td>
            <td>L</td>
        </tr>
        <tr>
            <td>O</td>
            <td>P</td>
            <td>Q</td>
        </tr>
        <tr>
            
            <td colspan="4">N</td>
            
        </tr>
    </table>
</body>
</html>
