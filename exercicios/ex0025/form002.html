<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        body{
            background-color: darkgrey;
        }
    </style>
</head>
<body style="font-family: Arial, Helvetica, sans-serif;">
    <h1 style="text-align: center;">Meu primeiro Formulario</h1>
    <form method="post" action="cadastro.php" autocomplete="on">
        <p>
            <label for="Inome">Nome</label>: <input type="text" name="nome" id="Inome"  required minlength="4" >
        </p>
        <p>
            <label for="Isobrenome">Sobrenome</label>: <input type="text" name="sobrenome" id="Isobrenome" required>
        </p>
        <p>
            <label for="Isen">Senha</label>
            <input type="password" name="sen" id="Isen" required minlength="5" autocomplete="current-password" placeholder="senha">
        </p>
        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
    </form>
</body>
</html>
