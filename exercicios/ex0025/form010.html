<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form method="post" action="cadastro.php" autocomplete="on">
        <p>
            <label for="iano">Sua data de nascimento: </label>
            <input type="number" name="ano" id="iano" min="1900" max="2026" oninput=calcidade()>
        </p>
        <p>
            <label for="idade">Sua idade é: </label>
            <outpu id="idade">0</output>
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

        <script>
            function calcidade() {
                let atual = new Date().getFullYear()
                let ano = document.getElementById("iano").value
                
                document.getElementById("idade").innerHTML = atual - Number(ano)
            }
        </script>
    </form>
</body>
</html>
