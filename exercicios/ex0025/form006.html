<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Testando Formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="Icolor">Cor: </label>
            <input type="color" name="color" id="Icolor">
        </p>
        <p>
            <label for="Inivel">Nivel: </label>
            <input type="range" name="nivel" id="Inivel" max="5" min="1" value="1">
        </p>
        <p>
            <label for="Ifile">Escolha o Arquivo: </label>
            <input type="file" name="file" id="Ifile">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Resetar">
        </p>
    </form>
</body>
</html>
