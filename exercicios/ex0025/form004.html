<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1> teste de Formulario</h1>
    <form action="cadastro.php">
        <fieldset>
            <legend>Dados do Usúario</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="Nome" id="inome" required>
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" required>
            </p>
            <p>
                <label for="itelefone">Telefone</label>
                <input type="tel" name="Telefone" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" id="itelefone" placeholder="(xx)xxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit">
            <input type="reset">
        </p>

    
    </form>
</body>
</html>
